name: Release

# Push a version tag → build the Windows setup.exe
#
# Transparency rules requested for releases:
#   * only this workflow creates the release and uploads its assets;
#   * the release body links to this exact workflow run and carries the asset's SHA256;
#   * a build-provenance attestation is generated for every asset, so the
#     asset can be cryptographically verified against this workflow
#     (`gh attestation verify <file> -o evansrrr`). Requires a PUBLIC repository.
#   * tags containing `-beta` or `-alpha` are marked pre-release; everything
#     else is a normal release. Either way it starts as a **draft** for manual
#     review before publishing.
#
# Release notes come from CHANGELOG.md: the workflow extracts the
# `## [x.y.z]` section for the tag (exact tag version first, e.g.
# `0.3.0-beta.1`, then the base version `0.3.0`); a missing section fails the
# build so the changelog can never lag behind a release.

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write        # create the draft release + upload assets
  id-token: write        # provenance attestation
  attestations: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  # keep in sync with the local env
  TAURI_CLI_VERSION: '2.11.4'
  # 更新清单签名的 key id，与 internal/appupdate/update_public.pem 里的
  # Key-Id 头保持一致；留空则用公钥指纹（客户端两种 id 都认）。
  UPDATE_KEY_ID: '2026-11'

jobs:
  build-and-release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'

      - uses: dtolnay/rust-toolchain@stable

      # Caches registry + target + ~/.cargo/bin
      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Cache NSIS toolchain
        uses: actions/cache@v4
        with:
          path: ~/AppData/Local/tauri/NSIS
          key: nsis-3.11

      - name: Verify tag matches project version
        shell: pwsh
        run: |
          $tag = '${{ github.ref_name }}'
          $version = $tag.TrimStart('v')
          $base = ($version -split '-')[0]
          $conf = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          $cargoLine = Select-String -Path src-tauri/Cargo.toml -Pattern '^version\s*=\s*"([^"]+)"' | Select-Object -First 1
          $cargo = $cargoLine.Matches[0].Groups[1].Value
          if ($conf -ne $base) { throw "tag $tag implies version '$base' but tauri.conf.json says '$conf'" }
          if ($cargo -ne $base) { throw "tag $tag implies version '$base' but Cargo.toml says '$cargo'" }

          # The About row is the client's only idea of its own version: it parses
          # #versionValue to decide the update channel (a "-beta" suffix opts into
          # the beta channel) and renders it verbatim in 关于. tauri.conf/Cargo must
          # stay on the bare base for NSIS, so this span is the only place the
          # prerelease can live. If it disagrees with the tag, a stable build ships
          # announcing itself as a beta -- wrong version in 关于 and permanently
          # stuck requesting ?channel=beta.
          $html = Get-Content web/index.html -Raw
          $m = [regex]::Match($html, '<span id="versionValue">FreeV6 (v[^<]*)</span>')
          if (-not $m.Success) { throw "web/index.html: #versionValue span not found; the version guard cannot run" }
          $shown = $m.Groups[1].Value.TrimStart('v')
          if ($shown -ne $version) {
            throw "tag $tag implies UI version '$version' but web/index.html shows '$shown'"
          }
          Write-Host "tag $tag -> version $version (base $base), UI $shown OK"

      - name: Install pinned tauri-cli
        shell: pwsh
        run: |
          $want = $env:TAURI_CLI_VERSION
          $have = ''
          try { $have = ((cargo tauri --version 2>$null | Select-Object -First 1) -replace '^tauri-cli\s+', '').Trim() } catch {}
          if ($have -ne $want) {
            Write-Host "installing tauri-cli $want (found '$have')"
            cargo install tauri-cli --version $want --locked
          } else {
            Write-Host "tauri-cli $want already available"
          }

      - name: Embed Windows version resources (go-winres)
        shell: pwsh
        run: |
          go install github.com/tc-hib/go-winres@v0.3.3
          $v = (('${{ github.ref_name }}' -replace '^v', '') -split '-')[0]
          $ver4 = "$v.0"
          Set-Location cmd/freev6-helper
          go-winres make --in winres/winres.json --arch amd64 --product-version $ver4 --file-version $ver4

      - name: Build setup.exe (cargo tauri build)
        shell: pwsh
        run: |
          # 缓存或上一次构建可能在 bundle 目录留下别的版本：清单只能对应一个
          # 文件，猜错就会生成指向不存在资产的下载地址（v0.5.7-beta.1 实测
          # 5 个镜像 + 直连全部 404）。构建前先清干净。
          Remove-Item 'src-tauri/target/release/bundle/nsis/*-setup.exe' -Force -ErrorAction SilentlyContinue
          cargo tauri build

      # 产物名必须由 tag 唯一决定，而且清单、上传、attestation 都用这同一份路径。
      #
      # Tauri 的 NSIS 只用 tauri.conf 里的 base 版本命名，所以 beta 构建会产出
      # FreeV6_0.5.7_x64-setup.exe —— 和正式版同名。人工在 release 页面改名之后，
      # 签名清单里的 setup/download 仍指向旧名字（改名不可能改已签名的清单），
      # 于是更新链路全部 404。这里统一改成 FreeV6_<完整版本>_x64-setup.exe：
      # 正式版名字不变，测试版一定带 -beta.N 后缀，且与清单同源。
      - name: Name the installer
        id: package
        shell: pwsh
        run: |
          $version = ('${{ github.ref_name }}' -replace '^v', '')
          $base = ($version -split '-')[0]
          $dir = 'src-tauri/target/release/bundle/nsis'
          $found = @(Get-ChildItem "$dir/*-setup.exe" -ErrorAction SilentlyContinue)
          if ($found.Count -ne 1) {
            throw "expected exactly one *-setup.exe under $dir, found $($found.Count): $($found.Name -join ', ')"
          }
          $src = $found[0]
          $stem = $src.BaseName
          if ($stem -like "*_${base}_*") {
            $stem = $stem -replace "_$([regex]::Escape($base))_", "_${version}_"
          }
          $want = "$stem.exe"
          if (-not $want.Contains($version)) {
            throw "installer name '$want' does not carry the full version '$version'; beta and stable builds would be indistinguishable"
          }
          if ($src.Name -ne $want) {
            Move-Item -LiteralPath $src.FullName -Destination (Join-Path $src.DirectoryName $want) -Force
          }
          $path = Join-Path $src.DirectoryName $want
          "setup=$($path -replace '\\', '/')" >> $env:GITHUB_OUTPUT
          "name=$want" >> $env:GITHUB_OUTPUT
          Write-Host "installer: $want"

      - name: Extract release notes from CHANGELOG.md
        shell: pwsh
        run: |
          $tag = '${{ github.ref_name }}'
          $version = $tag.TrimStart('v')
          $base = ($version -split '-')[0]
          $changelog = Get-Content CHANGELOG.md -Raw
          $section = ''
          foreach ($v in @($version, $base)) {
            $pattern = "(?ms)^## \[$([regex]::Escape($v))\][^\r\n]*\r?\n.*?(?=^## \[|\z)"
            $m = [regex]::Match($changelog, $pattern)
            if ($m.Success) { $section = $m.Value.Trim(); break }
          }
          if (-not $section) {
            throw "CHANGELOG.md has no '## [$version]' or '## [$base]' section - add one before tagging."
          }
          # 与上传、attestation 用同一份路径（见 Name the installer）：清单里的
          # 名字必须就是 release 里的资产名，否则下载 404。
          $setupPath = '${{ steps.package.outputs.setup }}'
          $setupName = '${{ steps.package.outputs.name }}'
          if (-not (Test-Path $setupPath)) {
            throw "installer $setupName is missing after the naming step"
          }
          $sha = (Get-FileHash $setupPath -Algorithm SHA256).Hash.ToLower()
          $runUrl = '${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}'
          $body = @(
            $section
            ''
            '---'
            ''
            "[构建过程]($runUrl)"
          ) -join "`n"
          $body | Out-File -FilePath release-notes.md -Encoding utf8
          Write-Host "release notes extracted for $version"

          $relInfo = [ordered]@{
            version  = $version
            tag      = $tag
            notes    = $section
            setup    = $setupName
            download = "https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/$setupName"
            sha256   = $sha
          }
          $relInfo | ConvertTo-Json -Depth 4 | Out-File -FilePath version.json -Encoding utf8
          Write-Host "version.json written for $version"

      # 清单与安装包同源（同一镜像族），哈希不能单独作为完整性锚点。
      # 签名覆盖的是**即将上传的那份字节**，任何行尾/编码改动都会让客户端验签失败。
      - name: Build update signing tool
        run: go build -o sign.exe ./cmd/freev6-update-sign

      - name: Sign version.json
        shell: pwsh
        env:
          SIGNING_KEY: ${{ secrets.FREEV6_UPDATE_SIGNING_KEY }}
        run: |
          if (-not $env:SIGNING_KEY) {
            throw '缺少 Secret FREEV6_UPDATE_SIGNING_KEY：拒绝产出未签名版本（新客户端会拒绝这类清单）。见 docs/release.md「签名密钥运维」。'
          }
          # 客户端按原始字节验签，也必须能按 UTF-8 直接解析：BOM 会让首字节不是 '{'。
          $bytes = [IO.File]::ReadAllBytes('version.json')
          if ($bytes.Length -lt 1 -or $bytes[0] -ne 0x7B) {
            throw "version.json 首字节不是 '{'（可能写成了带 BOM 的 UTF-8）"
          }

          $keyPath = Join-Path $env:RUNNER_TEMP 'freev6-update-signing-key.pem'
          try {
            # 私钥只在本次 step 的临时文件里出现，finally 里无条件删除。
            Set-Content -Path $keyPath -Value $env:SIGNING_KEY -NoNewline -Encoding utf8
            .\sign.exe -in version.json -out version.json.sig -key-file $keyPath -key-id $env:UPDATE_KEY_ID
            # 上传前先自检：公钥没进仓库时这一步就会失败，而不是等用户更新时才发现。
            .\sign.exe -verify -in version.json -sig version.json.sig
          } finally {
            Remove-Item $keyPath -Force -ErrorAction SilentlyContinue
          }

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            ${{ steps.package.outputs.setup }}
            version.json
            version.json.sig

      - name: Create draft release and upload the setup.exe
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          # 任何带后缀的 tag 都是预发布：只认 -beta / -alpha 时，v0.5.7-rc.1
          # 会被标成正式版，releases/latest 随即指向 RC，正式版用户被推上去。
          # 版本号本体不含 '-'，所以这个判断不会误伤正式版。
          prerelease: ${{ contains(github.ref_name, '-') }}
          body_path: release-notes.md
          files: |
            ${{ steps.package.outputs.setup }}
            version.json.sig
            version.json
          fail_on_unmatched_files: true
          # Upload assets one by one to avoid GitHub dropping parallel upload connections.
          preserve_order: true

      # 上传后从 release 拉回来再验一次：证明"发出去的字节"和"签过的字节"一致
      # （本地文件被后续步骤改写、或上传通道做了任何转换，这里都会暴露）。
      # 安装包也要按清单里的 sha256 复核：只验清单的话，附件被替换/传坏没人发现。
      - name: Verify the uploaded assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = '${{ github.ref_name }}'
          New-Item -ItemType Directory -Force -Path verify | Out-Null
          gh release download $tag --pattern 'version.json' --pattern 'version.json.sig' --dir verify --clobber
          .\sign.exe -verify -in verify/version.json -sig verify/version.json.sig

          $manifest = Get-Content verify/version.json -Raw | ConvertFrom-Json
          if (-not $manifest.setup -or -not $manifest.sha256) {
            throw 'version.json 缺少 setup 或 sha256'
          }
          gh release download $tag --pattern $manifest.setup --dir verify --clobber
          $installer = Join-Path verify $manifest.setup
          if (-not (Test-Path $installer)) {
            throw "安装包 $($manifest.setup) 没有出现在 release 里"
          }
          $actual = (Get-FileHash $installer -Algorithm SHA256).Hash.ToLower()
          if ($actual -ne $manifest.sha256.ToLower()) {
            throw "上传后的安装包 SHA256 与签名清单不一致: $actual != $($manifest.sha256)"
          }
          Write-Host "uploaded installer sha256 OK: $actual"
