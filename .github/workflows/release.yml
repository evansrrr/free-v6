name: Release

# Push a version tag → build the Windows setup.exe
#
# Transparency rules requested for releases:
#   * only this workflow creates the release and uploads its assets;
#   * the release body links to this exact workflow run and carries the asset's SHA256;
#   * a build-provenance attestation is generated for every asset, so the
#     asset can be cryptographically verified against this workflow
#     (`gh attestation verify <file> -o evansrrr`). Requires a PUBLIC repository.
#   * tags containing `-beta` or `-alpha` are marked pre-release; everything
#     else is a normal release. Either way it starts as a **draft** for manual
#     review before publishing.
#
# Release notes come from CHANGELOG.md: the workflow extracts the
# `## [x.y.z]` section for the tag (exact tag version first, e.g.
# `0.3.0-beta.1`, then the base version `0.3.0`); a missing section fails the
# build so the changelog can never lag behind a release.

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write        # create the draft release + upload assets
  id-token: write        # provenance attestation
  attestations: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  # keep in sync with the local env
  TAURI_CLI_VERSION: '2.11.4'

jobs:
  build-and-release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'

      - uses: dtolnay/rust-toolchain@stable

      # Caches registry + target + ~/.cargo/bin
      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Cache NSIS toolchain
        uses: actions/cache@v4
        with:
          path: ~/AppData/Local/tauri/NSIS
          key: nsis-3.11

      - name: Verify tag matches project version
        shell: pwsh
        run: |
          $tag = '${{ github.ref_name }}'
          $version = $tag.TrimStart('v')
          $base = ($version -split '-')[0]
          $conf = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          $cargoLine = Select-String -Path src-tauri/Cargo.toml -Pattern '^version\s*=\s*"([^"]+)"' | Select-Object -First 1
          $cargo = $cargoLine.Matches[0].Groups[1].Value
          if ($conf -ne $base) { throw "tag $tag implies version '$base' but tauri.conf.json says '$conf'" }
          if ($cargo -ne $base) { throw "tag $tag implies version '$base' but Cargo.toml says '$cargo'" }

          # The About row is the client's only idea of its own version: it parses
          # #versionValue to decide the update channel (a "-beta" suffix opts into
          # the beta channel) and renders it verbatim in 关于. tauri.conf/Cargo must
          # stay on the bare base for NSIS, so this span is the only place the
          # prerelease can live. If it disagrees with the tag, a stable build ships
          # announcing itself as a beta -- wrong version in 关于 and permanently
          # stuck requesting ?channel=beta.
          $html = Get-Content web/index.html -Raw
          $m = [regex]::Match($html, '<span id="versionValue">FreeV6 (v[^<]*)</span>')
          if (-not $m.Success) { throw "web/index.html: #versionValue span not found; the version guard cannot run" }
          $shown = $m.Groups[1].Value.TrimStart('v')
          if ($shown -ne $version) {
            throw "tag $tag implies UI version '$version' but web/index.html shows '$shown'"
          }
          Write-Host "tag $tag -> version $version (base $base), UI $shown OK"

      - name: Install pinned tauri-cli
        shell: pwsh
        run: |
          $want = $env:TAURI_CLI_VERSION
          $have = ''
          try { $have = ((cargo tauri --version 2>$null | Select-Object -First 1) -replace '^tauri-cli\s+', '').Trim() } catch {}
          if ($have -ne $want) {
            Write-Host "installing tauri-cli $want (found '$have')"
            cargo install tauri-cli --version $want --locked
          } else {
            Write-Host "tauri-cli $want already available"
          }

      - name: Embed Windows version resources (go-winres)
        shell: pwsh
        run: |
          go install github.com/tc-hib/go-winres@v0.3.3
          $v = (('${{ github.ref_name }}' -replace '^v', '') -split '-')[0]
          $ver4 = "$v.0"
          Set-Location cmd/freev6-helper
          go-winres make --in winres/winres.json --arch amd64 --product-version $ver4 --file-version $ver4

      - name: Build setup.exe (cargo tauri build)
        run: cargo tauri build

      - name: Extract release notes from CHANGELOG.md
        shell: pwsh
        run: |
          $tag = '${{ github.ref_name }}'
          $version = $tag.TrimStart('v')
          $base = ($version -split '-')[0]
          $changelog = Get-Content CHANGELOG.md -Raw
          $section = ''
          foreach ($v in @($version, $base)) {
            $pattern = "(?ms)^## \[$([regex]::Escape($v))\][^\r\n]*\r?\n.*?(?=^## \[|\z)"
            $m = [regex]::Match($changelog, $pattern)
            if ($m.Success) { $section = $m.Value.Trim(); break }
          }
          if (-not $section) {
            throw "CHANGELOG.md has no '## [$version]' or '## [$base]' section - add one before tagging."
          }
          $setup = Get-ChildItem 'src-tauri/target/release/bundle/nsis/*-setup.exe' | Select-Object -First 1
          if (-not $setup) { throw 'no *-setup.exe found under target/release/bundle/nsis' }
          $sha = (Get-FileHash $setup.FullName -Algorithm SHA256).Hash.ToLower()
          $runUrl = '${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}'
          $body = @(
            $section
            ''
            '---'
            ''
            "[构建过程]($runUrl)"
          ) -join "`n"
          $body | Out-File -FilePath release-notes.md -Encoding utf8
          Write-Host "release notes extracted for $version"

          $relInfo = [ordered]@{
            version  = $version
            tag      = $tag
            notes    = $section
            setup    = $setup.Name
            download = "https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/$($setup.Name)"
            sha256   = $sha
          }
          $relInfo | ConvertTo-Json -Depth 4 | Out-File -FilePath version.json -Encoding utf8
          Write-Host "version.json written for $version"

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            src-tauri/target/release/bundle/nsis/*-setup.exe
            version.json

      - name: Create draft release and upload the setup.exe
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          # 任何带后缀的 tag 都是预发布：只认 -beta / -alpha 时，v0.5.7-rc.1
          # 会被标成正式版，releases/latest 随即指向 RC，正式版用户被推上去。
          # 版本号本体不含 '-'，所以这个判断不会误伤正式版。
          prerelease: ${{ contains(github.ref_name, '-') }}
          body_path: release-notes.md
          files: |
            src-tauri/target/release/bundle/nsis/*-setup.exe
            version.json
          fail_on_unmatched_files: true
          # Upload assets one by one to avoid GitHub dropping parallel upload connections.
          preserve_order: true
