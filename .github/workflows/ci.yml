name: CI

on:
  push:
  pull_request:

jobs:
  go:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
      - name: Format check
        shell: bash
        run: test -z "$(gofmt -l cmd internal)"
      - run: go test ./...
      - run: go vet ./...
      - name: Staticcheck
        uses: dominikh/staticcheck-action@v1
        with:
          version: '2024.1.1'

  # The Windows-only network tests skip on Linux, but the handler and
  # CoreStore concurrency (the parts most likely to race) are platform-neutral.
  # Windows-latest can't run -race without a working C toolchain in PATH.
  go-race:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
      - run: go test -race ./internal/... ./cmd/freev6-helper

  rust:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      # 版本漂移在发版前是看不见的：release.yml 的守卫只在 tag push 时跑，平时
      # 没人会发现 web/index.html 和 tauri.conf / Cargo.toml 已经不同步。这里做
      # 同一条只读校验（不带 tag：只要求 span 可解析、三处基础版本一致）。
      - name: Validate version consistency
        shell: pwsh
        run: |
          $html = Get-Content web/index.html -Raw
          $pattern = '<span id="versionValue">FreeV6 (v\d+\.\d+\.\d+(?:-[0-9A-Za-z.]+)?)</span>'
          $m = [regex]::Match($html, $pattern)
          if (-not $m.Success) { throw "web/index.html: #versionValue must look like 'FreeV6 v<semver>'" }
          $ui = $m.Groups[1].Value.TrimStart('v')
          $base = ($ui -split '-')[0]
          $conf = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          $cargoLine = Select-String -Path src-tauri/Cargo.toml -Pattern '^version\s*=\s*"([^"]+)"' | Select-Object -First 1
          $cargo = $cargoLine.Matches[0].Groups[1].Value
          if ($conf -ne $base) { throw "web/index.html shows $ui but tauri.conf.json says $conf" }
          if ($cargo -ne $base) { throw "web/index.html shows $ui but Cargo.toml says $cargo" }
          Write-Host "version OK: UI $ui / tauri $conf / cargo $cargo"
      # windows-latest images ship rustup/stable; print the resolved version
      # so a runner-image drift is visible in the log instead of silent.
      - name: Show Rust toolchain
        run: rustup show
      # tauri_build validates bundle inputs even for cargo check: the
      # externalBin sidecar is gitignored and normally produced by
      # beforeBuildCommand, which only runs under `tauri build/dev` — plain
      # cargo check skips it, so CI reproduces that step here (same command
      # as tauri.conf.json).
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
      - name: Build helper sidecar
        run: go build -o src-tauri/binaries/freev6-helper-x86_64-pc-windows-msvc.exe ./cmd/freev6-helper
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      # --locked: Cargo.lock is tracked; never re-resolve upstream crates in CI.
      # cargo test stays out on purpose: the test binary carries a
      # requireAdministrator manifest (os error 740 when not elevated).
      - run: cargo check --locked --manifest-path src-tauri/Cargo.toml

  # 前端没有打包/测试步骤，但有一类 bug 在运行时是完全静默的：
  # <md-icon> 用了字体子集里没有的名字时，浏览器回退成普通文字，
  # 再被 16px 的图标框一裁 —— 只剩首字母碎片（blur_on 曾显示成 "R"）。
  # check-icons.py 扫 index.html + app.js 里所有字体图标名，对不上就让 CI 失败。
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Frontend syntax
        # Every served script, including the classic-script libs: naming files
        # individually let halloween.js/material.js drift out of the guard.
        run: |
          for file in web/*.js web/lib/*.js; do
            node --check "$file"
          done
      # 整个目录跑，而不是点名某个文件：新增的用例（如 ipv6-gate）自动进入
      # CI，不会因为忘记改这一行而永远不执行。
      - name: Frontend tests
        run: node --test tests/*.test.js
      - name: Icon subset guard
        run: python3 scripts/check-icons.py
