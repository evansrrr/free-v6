<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#121318" />
  <title>freev6</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app-shell">

    <!-- ── Navigation Rail ─────────────────────────────────────── -->
    <aside class="rail" aria-label="主导航">
      <div class="brand-mark" aria-label="freev6">f<span>6</span></div>
      <nav class="nav-list">
        <button class="nav-item active" data-view="dashboard" aria-label="仪表盘">
          <span class="nav-icon">📊</span><span>仪表盘</span>
        </button>
        <button class="nav-item" data-view="proxies" aria-label="代理">
          <span class="nav-icon">🌐</span><span>代理</span>
        </button>
        <button class="nav-item" data-view="settings" aria-label="设置">
          <span class="nav-icon">⚙️</span><span>设置</span>
        </button>
      </nav>
      <button class="nav-item bottom-item" id="logsButton" aria-label="日志">
        <span class="nav-icon">📋</span><span>日志</span>
      </button>
    </aside>

    <main class="main-content" id="mainContent">

      <!-- ── Top Bar ─────────────────────────────────────────── -->
      <header class="topbar">
        <h1 class="page-title" id="pageTitle">仪表盘</h1>
        <div class="topbar-actions">
          <span class="connection-chip" id="connectionChip">
            <span class="status-dot" id="headerDot"></span>
            <span id="headerStatus">未连接</span>
          </span>
          <button class="icon-btn" id="refreshButton" title="刷新" aria-label="刷新">↻</button>
        </div>
      </header>

      <!-- ═══════════════════════════════════════════════════════ -->
      <!-- PAGE 1: Dashboard                                      -->
      <!-- ═══════════════════════════════════════════════════════ -->
      <section class="view active" id="dashboardView">
        <div class="dashboard-grid">

          <!-- Traffic Chart -->
          <div class="card card-traffic">
            <div class="card-header">
              <div class="card-header-icon">📈</div>
              <div class="card-header-text">
                <h3>实时流量</h3>
                <p>最近 60 秒</p>
              </div>
              <div class="traffic-speeds">
                <div class="speed-item">
                  <span class="speed-dot upload"></span>
                  <span>↑</span>
                  <span class="speed-value" id="speedUp">0 B/s</span>
                </div>
                <div class="speed-item">
                  <span class="speed-dot download"></span>
                  <span>↓</span>
                  <span class="speed-value" id="speedDown">0 B/s</span>
                </div>
              </div>
            </div>
            <div class="traffic-chart-wrap">
              <canvas id="trafficCanvas"></canvas>
            </div>
          </div>

          <!-- Proxy Toggle -->
          <div class="card card-toggle toggle-card" id="proxyToggle">
            <div class="toggle-track">
              <span class="toggle-icon" id="toggleIcon">▶</span>
            </div>
            <span class="toggle-label" id="toggleLabel">启动免流</span>
            <span class="toggle-status" id="toggleStatus">点击启动 mihomo</span>
          </div>

          <!-- Mode Selector -->
          <div class="card card-mode">
            <div class="card-header">
              <div class="card-header-icon">🏷</div>
              <div class="card-header-text">
                <h3>出站模式</h3>
                <p>选择流量策略</p>
              </div>
            </div>
            <div class="mode-options" id="modeOptions">
              <div class="mode-option selected" data-mode="rule">
                <div class="mode-radio"></div>
                <div class="mode-option-text">
                  <h4>规则模式</h4>
                  <p>校园网直连，其余走 WARP</p>
                </div>
              </div>
              <div class="mode-option" data-mode="global">
                <div class="mode-radio"></div>
                <div class="mode-option-text">
                  <h4>全局模式</h4>
                  <p>所有流量走 WARP 隧道</p>
                </div>
              </div>
            </div>
          </div>

          <!-- Network Detection -->
          <div class="card card-network">
            <div class="card-header">
              <div class="card-header-icon">🌐</div>
              <div class="card-header-text">
                <h3>网络检测</h3>
                <p>出口与本机地址</p>
              </div>
            </div>
            <div class="network-section">
              <div class="network-row">
                <div class="network-row-label">🌍 出口 IP</div>
                <div class="network-row-value" id="egressIP">--</div>
              </div>
              <div class="network-sep"></div>
              <div class="network-row">
                <div class="network-row-label">📡 内网 IPv4</div>
                <div class="network-row-value" id="localIPv4">--</div>
              </div>
              <div class="network-row">
                <div class="network-row-label">📡 内网 IPv6</div>
                <div class="network-row-value" id="localIPv6">--</div>
              </div>
            </div>
          </div>

          <!-- Traffic Stats -->
          <div class="card card-stats">
            <div class="card-header">
              <div class="card-header-icon">📊</div>
              <div class="card-header-text">
                <h3>流量统计</h3>
                <p>本次会话累计</p>
              </div>
            </div>
            <div class="stats-ring-wrap">
              <svg class="stats-ring" viewBox="0 0 36 36" aria-hidden="true">
                <circle cx="18" cy="18" r="15.5" stroke="var(--md-surface-container-highest)" stroke-width="3" />
                <circle cx="18" cy="18" r="15.5" stroke="var(--md-primary)" stroke-width="3"
                        stroke-dasharray="97.4" stroke-dashoffset="97.4" transform="rotate(-90 18 18)"
                        id="ringUpload" />
                <circle cx="18" cy="18" r="12" stroke="var(--md-surface-container-highest)" stroke-width="3" />
                <circle cx="18" cy="18" r="12" stroke="var(--md-tertiary)" stroke-width="3"
                        stroke-dasharray="75.4" stroke-dashoffset="75.4" transform="rotate(-90 18 18)"
                        id="ringDownload" />
              </svg>
              <div class="stats-legend">
                <div class="stats-legend-item">
                  <span class="stats-legend-dot" style="background:var(--md-primary)"></span>
                  <span class="stats-legend-text">上传</span>
                  <span class="stats-legend-value" id="totalUp">0 B</span>
                </div>
                <div class="stats-legend-item">
                  <span class="stats-legend-dot" style="background:var(--md-tertiary)"></span>
                  <span class="stats-legend-text">下载</span>
                  <span class="stats-legend-value" id="totalDown">0 B</span>
                </div>
              </div>
            </div>
          </div>

        </div><!-- /dashboard-grid -->
      </section>

      <!-- ═══════════════════════════════════════════════════════ -->
      <!-- PAGE 2: Proxies                                        -->
      <!-- ═══════════════════════════════════════════════════════ -->
      <section class="view" id="proxiesView">
        <div class="empty-state">
          <span class="empty-state-icon">🌐</span>
          <span>代理页面 - Phase 2 实现</span>
        </div>
      </section>

      <!-- ═══════════════════════════════════════════════════════ -->
      <!-- PAGE 3: Settings                                       -->
      <!-- ═══════════════════════════════════════════════════════ -->
      <section class="view" id="settingsView">
        <div class="empty-state">
          <span class="empty-state-icon">⚙️</span>
          <span>设置页面 - Phase 3 实现</span>
        </div>
      </section>

    </main>
  </div>

  <!-- ── Log Drawer ──────────────────────────────────────────── -->
  <div class="scrim" id="scrim"></div>
  <aside class="log-drawer" id="logDrawer" aria-label="运行日志">
    <div class="drawer-header">
      <h2>运行日志</h2>
      <button class="icon-btn" id="closeLogs" aria-label="关闭日志">✕</button>
    </div>
    <div class="log-list" id="logList"></div>
  </aside>

  <script src="app.js"></script>
</body>
</html>
